[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pf-risk-simulator"
version = "0.0.1"
description = "Monthly cash-flow and refinancing stress simulator for Korean real estate project finance."
authors = [
  { name = "Minsung Kim" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"

[tool.flit.module]
name = "pf_liquidity_risk"


[tool.ruff]
line-length = 99
src = ["pf_liquidity_risk"]
include = ["pyproject.toml", "pf_liquidity_risk/**/*.py", "pipeline/**/*.py", "tests/**/*.py"]
required-version = "==0.16.0"

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["pf_liquidity_risk", "pipeline"]
force-sort-within-sections = true
